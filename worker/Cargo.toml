[package]
name = "darash-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
url = "2"
# The crate itself, extraction-only (no reqwest/tokio) so it builds for wasm.
darash = { git = "https://github.com/tschk/darash", branch = "main", default-features = false }

[profile.release]
opt-level = "s"
