name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --locked --no-default-features --lib
      - run: cargo test --locked --features browser
      - name: Synthetic Chromium fixtures (installed runtime, no downloads)
        env:
          DARASH_TEST_BROWSER: /usr/bin/google-chrome
        run: cargo test --locked --features browser browser::tests::chromium -- --ignored --test-threads=1
