[package]
name = "darash"
version = "0.7.0"
edition = "2021"
license = "ISC"
description = "All-in-one research crate: async search, page fetch, and HTML extraction with no API keys"
repository = "https://github.com/tschk/darash"
keywords = ["search", "searxng", "http", "async", "cli"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
native-tls = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
scraper = "0.26"
url = "2"
log = "0.4.33"
regex = "1"
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench"
harness = false
