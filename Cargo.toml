[package]
name = "darash"
version = "0.1.1"
edition = "2021"
license = "MPL-2.0"
description = "Provider-neutral async client for SearxNG-compatible local search"
repository = "https://github.com/tschk/darash"
keywords = ["search", "searxng", "http", "async"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
