[package]
name = "darash"
version = "0.4.0"
edition = "2021"
license = "ISC"
description = "Provider-neutral async client with an in-process search engine and SearxNG support"
repository = "https://github.com/tschk/darash"
keywords = ["search", "searxng", "http", "async"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
scraper = "0.26"
url = "2"
