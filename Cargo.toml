[package]
name = "darash"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0"
description = "Provider-neutral async client with embedded Websurfx and SearxNG support"
repository = "https://github.com/tschk/darash"
keywords = ["search", "searxng", "http", "async"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
websurfx = { version = "1.29.9", default-features = false }
url = "2"
