[package]
name = "moonshine-cloudflare"
version = "0.1.0"
edition = "2021"
license = "ISC"
description = "Serve a Moonshine manifest (crepuscularity) from a Rust Cloudflare Worker: ASSETS-first static edge with manifest route matching and per-route cache"

[dependencies]
worker = "0.8.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.notes]
scope = "static surface: prerendered output served from the ASSETS binding; SSR route modules stay with the JS adapter"
